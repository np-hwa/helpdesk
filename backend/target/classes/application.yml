server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: helpdesk-backend
  threads:
    virtual:
      enabled: true

  datasource:
    # 1. Đổi tên database mặc định từ 'helpdesk_db' sang 'helpdesk' để khớp với docker-compose.yml
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/helpdesk?serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Giữ nguyên validate để Hibernate đối chiếu entity với schema do Flyway container tạo
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          "[time_zone]": Asia/Ho_Chi_Minh

  # 2. Tắt Flyway trong backend theo đúng tài liệu (Flyway chạy độc lập qua Docker Compose)
  flyway:
    enabled: false

# 3. Gộp và chuyển toàn bộ cấu hình sang prefix 'helpdesk.*' để JwtTokenProvider inject chính xác
# spring-boot-properties-suppress
helpdesk:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d7e1b5a3f6c8e0d2b4a6f8c1d3e5b7a9f2c4d6e8b0a2c4d6e8f0a2b4c}
    expiration-ms: ${JWT_ACCESS_EXPIRATION:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html