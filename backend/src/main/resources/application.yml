server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: helpdesk-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/helpdesk_db?serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Custom Application Config
helpdesk:
  jwt:
    # Key chuỗi Secret 256-bit+ hoá Base64
    secret: ${JWT_SECRET:9a4f2c8d7e1b5a3f6c8e0d2b4a6f8c1d3e5b7a9f2c4d6e8b0a2c4d6e8f0a2b4c}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:86400000} # 1 ngày (86,400,000 ms)
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 ngày (604,800,000 ms)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
