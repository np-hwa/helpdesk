spring:
  datasource:
    url: jdbc:mysql://localhost:3306/helpdesk_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:helpdesk-super-secret-key-must-be-at-least-256-bits-long-change-in-production}
    access-token-expiration-ms: 900000        # 15 phút
    refresh-token-expiration-days: 7
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 3
  auto-close:
    days-after-resolved: 3                    # tự đóng sau 3 ngày không xác nhận

logging:
  level:
    com.helpdesk: INFO
    org.springframework.security: WARN
